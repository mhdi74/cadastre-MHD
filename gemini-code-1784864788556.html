<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه کاداستر ثبتی</title>
    <!-- SDK اصلی تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f8);
            --text-color: var(--tg-theme-text-color, #222222);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --btn-color: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #888888);
            --border-color: #e0e0e0;
        }

        body {
            font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            direction: rtl;
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.05rem;
            color: var(--btn-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.9rem;
        }

        textarea {
            resize: vertical;
        }

        /* جدول پویای مجاورین */
        .range-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr 2fr auto;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }

        .btn-del {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            width: 100%;
            font-size: 0.85rem;
            margin-top: 5px;
            font-weight: bold;
        }

        .submit-btn {
            background-color: var(--btn-color);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--hint-color);
            margin-top: 3px;
        }
    </style>
</head>
<body>

    <!-- بخش اول: مشخصات متقاضی و ملک -->
    <div class="card">
        <h3>📋 مشخصات متقاضی و پروژه</h3>
        <div class="form-group">
            <label>نام و نام خانوادگی مالک / متقاضی:</label>
            <input type="text" id="applicant_name" value="جمشید نیکخواه بهرامی">
        </div>
        <div class="form-group">
            <label>کد ملی / شناسه ملی:</label>
            <input type="text" id="national_id" value="5889811193">
        </div>
        <div style="display: flex; gap: 8px;">
            <div class="form-group" style="flex: 1;">
                <label>مساحت بنا (m²):</label>
                <input type="number" id="building_area" value="0.0" step="0.01">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>زون UTM:</label>
                <input type="number" id="zone" value="39">
            </div>
        </div>
    </div>

    <!-- بخش دوم: ورود مختصات -->
    <div class="card">
        <h3>📍 مختصات رئوس (X, Y)</h3>
        <div class="form-group">
            <textarea id="coords_text" rows="5" placeholder="مثال:&#10;X=522100.25 Y=4012300.50&#10;یا کپی‌پیست جدول مختصات..."></textarea>
            <div class="hint">مختصات را می‌توانید با X= و Y= یا به‌صورت ستونی وارد کنید.</div>
        </div>
    </div>

    <!-- بخش سوم: تعیین مجاورین (پویا) -->
    <div class="card">
        <h3>🔗 تعیین مجاورین (بازه‌ای)</h3>
        <div id="ranges-container">
            <!-- ردیف‌ها اینجا به صورت هوشمند اضافه می‌شوند -->
        </div>
        <button type="button" class="btn-add" onclick="addRangeRow()">➕ افزودن بازه مجاور جدید</button>
    </div>

    <!-- دکمه ارسال -->
    <button id="submit-btn" class="submit-btn" onclick="sendData()">🚀 پردازش و صدور نقشه‌ها</button>

    <script>
        // مقداردهی اولیه SDK تلگرام
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // باز کردن کامل صفحه در گوشی

        // افزودن اولین ردیف جدول مجاورین به طور پیش‌فرض
        window.onload = function() {
            addRangeRow(1, 5, "مرز", "باقیمانده پلاک 7 فرعی");
        };

        // تابع ساخت ردیف جدید در جدول مجاورین
        function addRangeRow(start = 1, end = 2, type = "مرز", name = "") {
            const container = document.getElementById('ranges-container');
            const rowDiv = document.createElement('div');
            rowDiv.className = 'range-row';
            rowDiv.innerHTML = `
                <input type="number" class="r-start" placeholder="از" value="${start}">
                <input type="number" class="r-end" placeholder="تا" value="${end}">
                <select class="r-type">
                    <option value="مرز" ${type === "مرز" ? "selected" : ""}>مرز</option>
                    <option value="دیوار" ${type === "دیوار" ? "selected" : ""}>دیوار</option>
                    <option value="کوچه" ${type === "کوچه" ? "selected" : ""}>کوچه</option>
                    <option value="خیابان" ${type === "خیابان" ? "selected" : ""}>خیابان</option>
                </select>
                <input type="text" class="r-name" placeholder="نام مجاور" value="${name}">
                <button type="button" class="btn-del" onclick="removeRangeRow(this)">✕</button>
            `;
            container.appendChild(rowDiv);
        }

        // حذف ردیف مجاور
        function removeRangeRow(btn) {
            const row = btn.parentElement;
            row.remove();
        }

        // استخراج اطلاعات جدول مجاورین
        function getRangesData() {
            const rows = document.querySelectorAll('.range-row');
            const ranges = [];
            rows.forEach(row => {
                ranges.push({
                    "راس ابتدا": parseInt(row.querySelector('.r-start').value) || 1,
                    "راس انتها": parseInt(row.querySelector('.r-end').value) || 2,
                    "نوع مرز": row.querySelector('.r-type').value,
                    "نام مجاور": row.querySelector('.r-name').value || "---"
                });
            });
            return ranges;
        }

        // جمع‌آوری و ارسال کل فرم به بک‌اند
        async function sendData() {
            const coordsText = document.getElementById('coords_text').value.trim();
            
            if (!coordsText) {
                tg.showAlert("لطفاً مختصات رئوس را وارد کنید!");
                return;
            }

            // افکت ویبره گوشی (Haptic Feedback)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "⏳ در حال محاسبات هندسی...";

            const payload = {
                user_id: tg.initDataUnsafe?.user?.id || 12345678, // آیدی تلگرام کاربر
                applicant_name: document.getElementById('applicant_name').value,
                national_id: document.getElementById('national_id').value,
                building_area: parseFloat(document.getElementById('building_area').value) || 0.0,
                zone: parseInt(document.getElementById('zone').value) || 39,
                coords_text: coordsText,
                ranges: getRangesData()
            };

            try {
                // ارسال درخواست به API بک‌اند پایتون
                const response = await fetch("YOUR_BACKEND_API_URL/process", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    tg.showAlert("✅ محاسبات با موفقیت انجام شد! فایل‌ها در چت تلگرام ارسال شدند.");
                    tg.close(); // بستن مینی‌اپ
                } else {
                    tg.showAlert("❌ خطا در پردازش: " + result.error);
                }
            } catch (err) {
                tg.showAlert("⚠️ خطا در ارتباط با سرور بک‌اند!");
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 پردازش و صدور نقشه‌ها";
            }
        }
    </script>
</body>
</html>
